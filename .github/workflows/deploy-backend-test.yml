name: Build and Push Backend (test branch)

on:
  push:
    branches:
      - test

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger EasyPanel test deployment (optional)
        if: ${{ vars.EASYPANEL_DEPLOY_BACKEND_TEST_WEBHOOK != '' || secrets.EASYPANEL_DEPLOY_BACKEND_TEST_WEBHOOK != '' }}
        run: |
          echo "Triggering EasyPanel TEST backend deployment (pull image only, no build)..."
          response=$(curl -s -w "%{http_code}" -X POST "${{ secrets.EASYPANEL_DEPLOY_BACKEND_TEST_WEBHOOK }}")
          http_code="${response: -3}"
          if [ "$http_code" = "200" ] || [ "$http_code" = "201" ] || [ "$http_code" = "204" ]; then
            echo "Deployment webhook triggered successfully (HTTP $http_code)"
          else
            echo "Deployment webhook failed (HTTP $http_code)"
            echo "Response: ${response%???}"
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "Test image built and pushed:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-${{ github.sha }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Author:  ${{ github.actor }}"
          echo "Time:    $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "Este workflow NO toca el servicio de producción (main)."
          echo "Para probar en EasyPanel: crea un servicio aparte (p.ej. 'bryan-backend-test')"
          echo "con Source = Docker Image apuntando a la tag :test, o configura el secret"
          echo "EASYPANEL_DEPLOY_BACKEND_TEST_WEBHOOK si ya tienes ese servicio con webhook."
